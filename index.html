<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("planner-theme");
        } catch {
          // Follow the system preference if site storage is unavailable.
        }
        const colors = {
          light: "#f7f6f2",
          dark: "#1d2720",
          "sierra-blue": "#f4f8fb",
          "deep-black": "#111519",
          gray: "#f8f8f8",
        };
        const theme = Object.prototype.hasOwnProperty.call(colors, saved)
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", colors[theme]);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" />
    <title>Planner — Make room for what matters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
